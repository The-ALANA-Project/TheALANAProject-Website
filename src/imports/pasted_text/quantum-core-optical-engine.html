<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANTUM CORE: OPTICAL ENGINE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-red: #ff0055;
            --glass: rgba(10, 10, 12, 0.6);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            background: #050505;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            color: white;
        }

        #canvas-container { position: fixed; inset: 0; z-index: 1; }

        /* I Updated The Vignette: Softer, more like a physical camera lens housing */
        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 11;
            background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 110%);
        }

        #ui-layer {
            position: fixed; inset: 0; z-index: 20; display: flex;
            flex-direction: column; justify-content: space-between; padding: 40px; pointer-events: none;
        }

        .hud-header { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .sys-status {
            font-family: 'Syncopate', sans-serif; font-size: 16px; letter-spacing: 4px;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue);
            border-left: 2px solid var(--neon-blue); padding-left: 20px;
        }
        .sys-sub { font-size: 10px; opacity: 0.6; margin-top: 5px; font-family: 'Rajdhani'; letter-spacing: 2px; }

        .data-column {
            text-align: right; font-family: monospace; font-size: 10px; color: var(--neon-blue);
            opacity: 0.8; line-height: 1.8; border-right: 2px solid rgba(0, 243, 255, 0.3); padding-right: 20px;
        }

        .controls-wrapper { display: flex; justify-content: center; width: 100%; margin-bottom: 20px; }

        .controls-container {
            pointer-events: auto; background: var(--glass); padding: 10px;
            border: 1px solid var(--border); display: flex; gap: 10px;
            backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: skewX(-10deg);
        }

        .btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: white;
            font-family: 'Syncopate', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer; padding: 15px 30px; transition: all 0.2s ease;
            transform: skewX(10deg); min-width: 120px;
        }

        .btn:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 25px var(--neon-blue); border-color: var(--neon-blue); }
        .btn-alert:hover { background: var(--neon-red); color: white; box-shadow: 0 0 30px var(--neon-red); border-color: var(--neon-red); }

        #loader {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            color: var(--neon-blue); font-family: 'Syncopate'; letter-spacing: 5px;
            transition: opacity 1s;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loader">CALIBRATING LENS OPTICS...</div>
    <div class="vignette"></div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="hud-header">
            <div class="sys-status">
                A E T H E R
                <div class="sys-sub">OPTICAL SIMULATION v9.2</div>
            </div>
            <div class="data-column">
                LENS: ASPHERICAL<br>
                ABERRATION: RADIAL<br>
                DISTORTION: NOMINAL
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="controls-container">
                <button class="btn" id="btn-stabilize">Focus</button>
                <button class="btn btn-alert" id="btn-destabilize">Warp</button>
                <button class="btn" id="btn-reset">Reset</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { FilmPass } from 'three/addons/postprocessing/FilmPass.js'; 

        // SETUP 
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.025);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 7;

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // CORE SHADERS 
        const noiseVertex = `
            varying vec2 vUv; varying vec3 vNormal; varying vec3 vPos;
            uniform float uTime; uniform float uSpike;
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }
            void main() {
                vUv = uv; vNormal = normalize(normalMatrix * normal);
                float n = snoise(position * 2.5 + uTime * 0.5);
                float pulse = sin(uTime * 4.0) * 0.05;
                vec3 newPos = position + normal * (n * uSpike + pulse);
                vPos = newPos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
            }
        `;

        const plasmaFragment = `
            uniform vec3 uColorA; uniform vec3 uColorB; uniform float uTime;
            varying vec3 vNormal; varying vec3 vPos;
            void main() {
                vec3 viewDir = normalize(cameraPosition - vPos);
                float fresnel = dot(viewDir, vNormal);
                fresnel = clamp(1.0 - fresnel, 0.0, 1.0);
                fresnel = pow(fresnel, 2.0);
                float scan = sin(vPos.y * 50.0 + uTime * 5.0) * 0.05;
                vec3 color = mix(uColorA, uColorB, fresnel + scan);
                color += uColorB * fresnel * 2.5; 
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const sphereGeo = new THREE.IcosahedronGeometry(1.6, 64);
        const sphereMat = new THREE.ShaderMaterial({
            vertexShader: noiseVertex, fragmentShader: plasmaFragment,
            uniforms: {
                uTime: { value: 0 }, uSpike: { value: 0.2 },
                uColorA: { value: new THREE.Color('#000000') },
                uColorB: { value: new THREE.Color('#00f3ff') }
            }
        });
        const core = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(core);

        const particleCount = 4000;
        const particlesGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const speeds = new Float32Array(particleCount);
        const offset = new Float32Array(particleCount);
        for(let i=0; i<particleCount; i++) {
            const r = 2.5 + Math.random() * 8;
            const theta = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * 0.5;
            positions[i*3] = r * Math.cos(theta);
            positions[i*3+1] = r * Math.sin(phi);
            positions[i*3+2] = r * Math.sin(theta);
            speeds[i] = Math.random();
            offset[i] = r;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.04, color: 0x00f3ff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);


        // ADVANCED LENS SHADER (Custom) 
        // This shader simulates a physical glass lens with curvature and radial dispersion.
        const AdvancedLensShader = {
            uniforms: {
                'tDiffuse': { value: null },
                'uAberration': { value: 0.005 }, // Chromatic separation strength
                'uDistortion': { value: 0.2 }    // Barrel distortion strength (fisheye)
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAberration;
                uniform float uDistortion;
                varying vec2 vUv;

                // Function to apply Barrel Distortion
                vec2 distort(vec2 uv, float k) {
                    // Center the UVs at (0,0) instead of (0.5, 0.5)
                    vec2 centered = uv - 0.5;
                    float r2 = dot(centered, centered);
                    float f = 1.0 + r2 * (k + k * sqrt(r2));
                    // Return valid UVs or original if out of bounds (to avoid streaks)
                    return f * centered + 0.5;
                }

                void main() {
                    vec2 uv = vUv;
                    
                    // 1. Calculate warped UVs for Red, Green, and Blue channels separately
                    //    Red and Blue are distorted slightly differently than Green to create the prism effect.
                    
                    // High quality chromatic aberration: The offset increases with distance from center
                    float rDistortion = uDistortion; // Base distortion
                    float bDistortion = uDistortion;

                    // Apply chromatic aberration strength to the distortion factors
                    vec2 rUv = distort(uv, uDistortion - uAberration);
                    vec2 gUv = distort(uv, uDistortion);
                    vec2 bUv = distort(uv, uDistortion + uAberration);

                    // 2. Sample the texture
                    float r = texture2D(tDiffuse, rUv).r;
                    float g = texture2D(tDiffuse, gUv).g;
                    float b = texture2D(tDiffuse, bUv).b;

                    // 3. Vignette mask for the distortion edges (hide texture repeat artifacts)
                    // If the distortion pulls UVs < 0 or > 1, fade to black
                    float mask = 1.0;
                    if(rUv.x < 0.0 || rUv.x > 1.0 || rUv.y < 0.0 || rUv.y > 1.0) mask = 0.0;
                    if(bUv.x < 0.0 || bUv.x > 1.0 || bUv.y < 0.0 || bUv.y > 1.0) mask = 0.0;

                    gl_FragColor = vec4(r, g, b, 1.0) * mask;
                }
            `
        };


        // CINEMATIC PIPELINE 
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        // Bloom
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0; bloomPass.strength = 1.3; bloomPass.radius = 0.6;
        composer.addPass(bloomPass);

        // Film Grain
        const filmPass = new FilmPass(0.5, 0.05, 648, false);
        composer.addPass(filmPass);

        // REPLACEMENT: Advanced Lens Pass
        const lensPass = new ShaderPass(AdvancedLensShader);
        lensPass.uniforms.uAberration.value = 0.005; // Default slight separation
        lensPass.uniforms.uDistortion.value = 0.15;  // Default slight curve
        composer.addPass(lensPass);


        // INTERACTION
        let targetSpike = 0.2;
        let targetColor = new THREE.Color(0x00f3ff);
        let particleSpeedMult = 1.0;
        let shakeIntensity = 0;
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth/2) * 0.0005;
            mouseY = (e.clientY - window.innerHeight/2) * 0.0005;
        });

        function triggerShake(amt) { shakeIntensity = amt; }

        document.getElementById('btn-stabilize').addEventListener('click', () => {
            targetSpike = 0.1;
            targetColor.set('#00f3ff');
            bloomPass.strength = 1.3;
            particleSpeedMult = 0.5;
            
            // Interaction: Sharpen the lens (less distortion)
            lensPass.uniforms.uAberration.value = 0.002;
            lensPass.uniforms.uDistortion.value = 0.05; // Nearly flat lens
            
            triggerShake(0.1);
        });

        document.getElementById('btn-destabilize').addEventListener('click', () => {
            targetSpike = 1.2;
            targetColor.set('#ff0055');
            bloomPass.strength = 2.8;
            particleSpeedMult = 8.0;
            triggerShake(0.5);
            
            // Interaction: Warp the lens heavily (High distortion + splitting)
            // We animate the "Warp" for a shockwave effect
            lensPass.uniforms.uDistortion.value = 0.6; 
            lensPass.uniforms.uAberration.value = 0.04;
            
     // Recover slowly in the animate loop
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            targetSpike = 0.3;
            targetColor.set('#bc13fe');
            bloomPass.strength = 1.6;
            particleSpeedMult = 1.0;
            
            lensPass.uniforms.uAberration.value = 0.005;
            lensPass.uniforms.uDistortion.value = 0.15;
            
            triggerShake(0.2);
        });


        // ANIMATION 
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            sphereMat.uniforms.uTime.value = t;
            sphereMat.uniforms.uSpike.value += (targetSpike - sphereMat.uniforms.uSpike.value) * 0.05;
            sphereMat.uniforms.uColorB.value.lerp(targetColor, 0.05);
            
            particles.rotation.y = -t * 0.1 * particleSpeedMult;
            particlesMat.color.lerp(targetColor, 0.05);

            shakeIntensity *= 0.9;
            const shakeX = (Math.random() - 0.5) * shakeIntensity;
            const shakeY = (Math.random() - 0.5) * shakeIntensity;

            camera.position.x += (mouseX * 5 - camera.position.x) * 0.05 + shakeX;
            camera.position.y += (-mouseY * 5 - camera.position.y) * 0.05 + shakeY;
            camera.lookAt(scene.position);

       // Animate Lens Recovery
            if(lensPass.uniforms.uDistortion.value > 0.15 && targetColor.getHexString() !== 'ff0055') {
                 lensPass.uniforms.uDistortion.value += (0.15 - lensPass.uniforms.uDistortion.value) * 0.05;
                 lensPass.uniforms.uAberration.value += (0.005 - lensPass.uniforms.uAberration.value) * 0.05;
            }

            composer.render();
        }

        setTimeout(() => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1000);
            animate();
        }, 1200);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
